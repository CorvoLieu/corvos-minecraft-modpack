# Prod deploy: uses the custom image built from ./Dockerfile (modpack baked
# in) instead of a bind-mounted modpack.mrpack. Published by CI to GHCR;
# Watchtower replaces the container on every new image push, so world data
# lives in a named volume rather than a bind mount.
#
# Operational settings below (OPS, MEMORY, LEVEL, difficulty, etc.) are
# overridable per-deploy via a .env file next to this compose file -- Compose
# loads .env and substitutes ${VAR} automatically, no envsubst step needed.
# Copy .env.example to .env and edit as needed; unset vars fall back to the
# same defaults baked into the Dockerfile. VERSION / NEOFORGE_VERSION are
# tied to what the baked modpack was built against -- only override those if
# you know the image's mods actually support the version you're setting.
---
services:
  mc:
    # Published by .github/workflows/deploy.yml on every push to main.
    image: ${IMAGE_NAME:-ghcr.io/corvolieu/corvos-minecraft-modpack}:staging
    tty: true
    container_name: minecraft-server
    stdin_open: true
    restart: unless-stopped
    stop_grace_period: 3m
    ports:
      - "25565:25565"
      - "24454:24454"
      - "24454:24454/udp"
    environment:
      VERSION: "1.21.1"
      NEOFORGE_VERSION: "21.1.265"
      MEMORY: "13312M"
      LEVEL: "${LEVEL:-world}"
      # See docker-compose.dev.yml: copies the modpack's staged datapacks
      # into whichever world LEVEL names.
      DATAPACKS: "/data/datapacks"
      REMOVE_OLD_DATAPACKS: "true"
      DIFFICULTY: "normal"
      MODE: "creative"
      ONLINE_MODE: "false"
      FORCE_GAMEMODE: "true"
      ENABLE_AUTOPAUSE: "true"
      ENTITY_BROADCAST_RANGE_PERCENTAGE: "70"
      SIMULATION_DISTANCE: "6"
      VIEW_DISTANCE: "7"
      # Lets the OS batch chunk saves instead of blocking on each one. Much
      # less disk stall; a host crash or power cut can lose the last few
      # seconds of chunk changes, so keep backups.
      SYNC_CHUNK_WRITES: "false"
      # Time allowed for the world save on shutdown. stop_grace_period and
      # WATCHTOWER_TIMEOUT below must stay longer than this.
      STOP_DURATION: "150"
      ALLOW_FLIGHT: "true"
      RCON_CMDS_STARTUP: |
        /gamerule playersSleepingPercentage 0
        /gamerule mobGriefing false
      RCON_CMDS_ON_CONNECT: |
        /op @p
      ANNOUNCE_PLAYER_ACHIEVEMENTS: "false"
      # See docker-compose.dev.yml: this image's baked-in MODRINTH_MODPACK
      # install still runs on first container start and fetches each mod
      # jar from the Modrinth CDN, so it's exposed to the same
      # ReadTimeoutException on a slow/stalled file without this.
      FETCH_RESPONSE_TIMEOUT: "PT120S"
    volumes:
      - ./data:/data
    deploy:
      resources:
        limits:
          cpus: "3.5"
          # Container total. MEMORY (heap) stays ~3G below this: the JVM also needs
          # native memory, and going over the limit gets the server OOM-killed.
          memory: "16G"
    labels:
      # Only this container gets touched by Watchtower (--label-enable below).
      com.centurylinklabs.watchtower.enable: "true"

  watchtower:
    image: containrrr/watchtower
    container_name: watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Reuses the host docker daemon's registry auth (see README: `docker
      # login ghcr.io` must be run once on the VM if the GHCR package is
      # private).
    environment:
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_POLL_INTERVAL: "60"
      WATCHTOWER_CLEANUP: "true"
      # Default is 10s, which would kill the server mid-save on every update.
      WATCHTOWER_TIMEOUT: "180s"
