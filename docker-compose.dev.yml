---
services:
  mc-s3:
    image: itzg/minecraft-server:java21
    tty: true
    container_name: minecraft-server-s3
    stdin_open: true
    restart: unless-stopped
    ports:
      - "25565:25565"
      - "24454:24454"
      - "24454:24454/udp"
    environment:
      EULA: "TRUE"
      TYPE: "MODRINTH"
      VERSION: "1.21.1"
      FORCE_REDOWNLOAD: "true"
      NEOFORGE_VERSION: "21.1.233"
      FORGE_FORCE_REINSTALL: "true"
      MEMORY: "15360M"
      ONLINE_MODE: "false"
      DIFFICULTY: "normal"
      MODE: "survival"
      FORCE_GAMEMODE: "true"
      ENABLE_AUTOPAUSE: "true"
      MODRINTH_MODPACK: "/modpack.mrpack"
      MODRINTH_DEFAULT_VERSION_TYPE: "release"
      MODRINTH_LOADER: "neoforge"
      LEVEL: "creark"
      ENTITY_BROADCAST_RANGE_PERCENTAGE: "70"
      SIMULATION_DISTANCE: "7"
      VIEW_DISTANCE: "7"
      # SEED: ""
      ALLOW_FLIGHT: "true"
      OPS: |-
        CakeBoy
      RCON_CMDS_STARTUP: |-
        /gamerule playersSleepingPercentage 0
        /gamerule mobGriefing false
      RCON_CMDS_ON_CONNECT: |-
        /recipe give @p *
    volumes:
      - "./exports/client.mrpack:/modpack.mrpack:ro"
    deploy:
      resources:
        limits:
          cpus: "3.5"
          memory: "15G"

