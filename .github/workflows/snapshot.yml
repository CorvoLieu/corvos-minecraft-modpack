name: "[STAGING] Release snapshot modpack artifacts"

on:
  push:
    branches:
      - develop

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Compute release tag
        id: tag
        env:
          MANIFEST_FILE: ${{ vars.MANIFEST_FILE }}
          PACK_NAME: ${{ vars.PACK_NAME }}
        run: |
          echo "tag=$(scripts/release/compute-tag.sh)-snapshot" >> "$GITHUB_OUTPUT"

      - name: Check for existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/release/check-release-exists.sh "${{ steps.tag.outputs.tag }}" "${{ github.repository }}"

      - name: Build modpack artifacts
        env:
          PACK_NAME: ${{ vars.PACK_NAME }}
        run: make build-all

      - name: Rename artifacts for release
        env:
          PACK_NAME: ${{ vars.PACK_NAME }}
        run: |
          tag="${{ steps.tag.outputs.tag }}"
          pack_name="${PACK_NAME:-minecraft-modded}"
          pack_name="$(printf '%s' "$pack_name" | awk '{print toupper(substr($0,1,1)) substr($0,2)}')"
          mv exports/client.mrpack "exports/${pack_name}-$tag.mrpack"
          mv exports/server.mrpack "exports/${pack_name}-Server-$tag.mrpack"
          mv exports/mods-only.zip "exports/${pack_name}-Mods-Only-$tag.zip"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          body: |
            Modpack release ${{ steps.tag.outputs.tag }} from ${{ github.sha }}.

            ${{ github.event.head_commit.message }}
          files: |
            exports/*.mrpack
            exports/*.zip
